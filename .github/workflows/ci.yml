name: CI

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    types: ['opened', 'synchronize', 'reopened']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          cache-from: type=gha
          platforms: linux/amd64
          load: true
          tags: site:ci

      # Gates PRs (incl. Renovate's automerged base-image bumps) and main before publishing.
      - name: Smoke test image
        run: |
          docker run -d --rm --sysctl net.ipv4.ip_unprivileged_port_start=0 -p 8080:80 --name site site:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ -o "$RUNNER_TEMP/index.html" && break; sleep 1; done
          grep -q '<title>FruitieX</title>' "$RUNNER_TEMP/index.html"
          curl -fsS -o /dev/null http://127.0.0.1:8080/github-logo.svg
          # Render the page and fail on any console output (errors, failed loads).
          google-chrome --headless=new --no-sandbox --enable-logging=stderr --v=0 \
            --dump-dom http://127.0.0.1:8080/ > "$RUNNER_TEMP/dom.html" 2> "$RUNNER_TEMP/chrome.log"
          grep -q 'class="gh"' "$RUNNER_TEMP/dom.html"
          if grep ':CONSOLE' "$RUNNER_TEMP/chrome.log"; then exit 1; fi
          docker stop site

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to homelab
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip superseded builds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer commit exists on main, skipping deployment of this build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to homelab
        if: steps.check.outputs.enabled == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          repository: FruitieX/homelab
          event-type: image-update
          client-payload: |
            {
              "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",
              "digest": "${{ needs.build.outputs.digest }}",
              "revision": "${{ github.sha }}"
            }
